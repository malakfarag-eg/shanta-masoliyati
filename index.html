<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>شنطتي مسؤوليتي</title>
<style>
:root{--org:#ff9f45;--grass:#6bcb77;--ink:#2d2a5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;color:var(--ink);background:linear-gradient(#bfe8ff,#eaf8ff);min-height:100vh;overflow-x:hidden;transition:background .6s}
body.l1{background:linear-gradient(#c6f0cf,#f0fbe9)}body.l2{background:linear-gradient(#ffe7a0,#fff7d9)}body.l3{background:linear-gradient(#dccdfa,#f4eeff)}
#deco span{position:fixed;font-size:38px;opacity:.45;pointer-events:none;animation:fl 8s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-18px) rotate(8deg)}}
#bar{position:fixed;top:0;inset-inline:0;display:flex;gap:10px;align-items:center;padding:8px 14px;background:#ffffffd9;z-index:20;box-shadow:0 3px 10px #0002}
#bar button{font:inherit;font-size:18px;font-weight:700;border:0;border-radius:14px;padding:8px 14px;background:#e8f2ff;cursor:pointer}
#bar.nolv #back,#bar.nolv #rst{display:none}
#pg{flex:1;height:18px;background:#e3e3f3;border-radius:9px;overflow:hidden}#fill{height:100%;width:0;background:linear-gradient(90deg,#ffd93d,#6bcb77);transition:width .5s}
#st{font-weight:800;font-size:20px}
#app{padding:80px 16px 30px;min-height:100vh;animation:in .5s}@keyframes in{from{opacity:0;transform:translateX(-30px)}}
.btn{font:inherit;font-size:clamp(22px,3vw,34px);font-weight:800;padding:.5em 1.6em;border:0;border-radius:999px;background:var(--org);color:#fff;box-shadow:0 8px 0 #c76d1c;cursor:pointer}.btn:active{transform:translateY(6px);box-shadow:0 2px 0 #c76d1c}
.home{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
h1{font-size:clamp(34px,6vw,64px);margin:0;color:#4f3fb3}.sub{font-size:clamp(22px,3vw,34px);margin:0;font-weight:700}
.hero{width:clamp(180px,26vw,270px);animation:bob 2.4s ease-in-out infinite}.hero.sm{width:200px}.hero svg,.sal svg{width:100%;display:block}
@keyframes bob{50%{transform:translateY(-12px)}}
.lvl{max-width:1000px;margin:auto}
.coach{display:flex;align-items:center;gap:14px;margin-bottom:14px}.sal{width:120px;flex:none;animation:bob 2.4s ease-in-out infinite}
.bubble{position:relative;background:#fff;border-radius:26px;padding:14px 22px;font-size:clamp(20px,2.6vw,30px);font-weight:700;box-shadow:0 6px 0 #0001;min-height:60px;flex:1}
.bubble:before{content:"";position:absolute;right:-14px;top:50%;border:12px solid transparent;border-left-color:#fff;transform:translateY(-50%) scaleX(-1)}
.task{font-size:clamp(28px,4.5vw,48px);font-weight:800;text-align:center;margin:10px 0}
.choices{display:flex;flex-wrap:wrap;gap:22px;justify-content:center}
.card{font:inherit;background:#fff;border:6px solid #fff;border-radius:28px;box-shadow:0 8px 0 #2d2a5a26;cursor:pointer;padding:10px;width:clamp(130px,21vw,200px);display:flex;flex-direction:column;align-items:center;transition:transform .15s}
.card.big{width:clamp(170px,30vw,300px)}.card.sm{width:clamp(100px,14vw,140px)}.card:hover{transform:scale(1.05)}.card svg{width:100%;display:block}.card span{font-size:20px;font-weight:800}
.card.good{border-color:var(--grass);animation:pop .6s}.card.oops{border-color:var(--org);animation:wob .5s}.card.used{opacity:.35;pointer-events:none}.card.sel{border-color:#ffd93d;transform:scale(1.1);box-shadow:0 0 0 6px #ffd93d77}
@keyframes pop{40%{transform:scale(1.2) rotate(-4deg)}}@keyframes wob{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.subj{display:flex;align-items:center;justify-content:center;gap:16px}.sb{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;font-size:50px}
.tray{display:flex;gap:12px;justify-content:center;margin:12px 0 20px}.slot{width:84px;height:84px;border:5px dashed #ffb300;border-radius:20px;background:#fff9}.slot.full{border-style:solid;background:#fff;animation:pop .5s}.slot svg{width:100%}
.l3{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;align-items:center}.side{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:520px}
.bagwrap{position:relative;width:clamp(210px,28vw,290px);cursor:pointer}.bagwrap svg{width:100%;display:block}.bagwrap.full{animation:pop .8s}
.inbag{position:absolute;top:8%;left:10%;right:10%;display:flex;flex-wrap:wrap;gap:4px;justify-content:center}.pk{width:42%;animation:pop .5s}.pk svg{width:100%}
.hint{font-size:20px;margin:22px auto 0;display:block;background:#8e7cf0;box-shadow:0 6px 0 #5b49b8}
.map{display:flex;align-items:center;justify-content:center;gap:0;flex-wrap:wrap;margin-top:20px}.path{width:50px;border-top:8px dotted #ff9f45}
.stn{font:inherit;width:clamp(170px,25vw,240px);padding:20px 10px;border:0;border-radius:36px;background:#fff;box-shadow:0 10px 0 #2d2a5a26;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center}
.stn b{font-size:64px;font-weight:400}.stn span{font-size:22px;font-weight:800;color:#8e7cf0}.stn em{font-style:normal;font-size:24px;font-weight:800}.stn i{font-style:normal;height:26px}.stn.lock{filter:grayscale(1);opacity:.6}.stn.dn{background:#e9ffe9}.stn:not(.lock):hover{transform:scale(1.05)}
.done{text-align:center}.done h2{font-size:clamp(30px,5vw,52px);margin:6px}.trophy{font-size:100px;animation:bob 1.6s infinite}.starsrow{font-size:50px;margin-bottom:16px}
.fin{display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap}
.cf{position:fixed;top:-50px;z-index:50;pointer-events:none;animation:fall 1.8s ease-in forwards}@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.ph{position:relative;display:block;width:100%}.ph img{width:100%;display:block;border-radius:18px;background:#fff}
.bd{position:absolute;top:34%;left:50%;transform:translateX(-50%) rotate(-6deg);background:#fff;color:#222;font-size:clamp(16px,2.4vw,28px);font-weight:900;padding:2px 12px;border-radius:10px;box-shadow:0 2px 6px #0004}
.card.sm .bd{font-size:15px;padding:0 7px}
.bagwrap{display:flex;flex-direction:column-reverse}.bagimg{width:100%;display:block;filter:drop-shadow(0 12px 10px #0003)}
.inbag{position:static!important;margin-top:8px;min-height:70px;display:flex;gap:6px;justify-content:center;background:#ffffffb0;border-radius:18px;padding:6px}.pk{width:68px!important}
.card.sm{width:clamp(120px,16vw,165px)}
.tt{display:flex;gap:10px;justify-content:center;margin:0 0 12px;flex-wrap:wrap}.tt div{background:#fff;border-radius:20px;padding:6px 16px;font-size:20px;font-weight:800;opacity:.55;border:4px solid #fff}.tt div.now{opacity:1;border-color:#ffb300;box-shadow:0 0 0 4px #ffb30055;transform:scale(1.08)}
.card.glow{animation:gl 1s ease-in-out 3;border-color:#ffd93d}@keyframes gl{50%{transform:scale(1.1);box-shadow:0 0 0 10px #ffd93d99}}
.side{max-width:680px!important}.bagimg{border-radius:26px;background:#fff;filter:none!important;box-shadow:0 8px 0 #2d2a5a26}</style></head><body>
<div id="deco"><span style="top:12%;right:4%">☁️</span><span style="top:30%;left:3%;animation-delay:2s">⭐</span><span style="bottom:12%;right:6%;animation-delay:1s">✏️</span><span style="bottom:20%;left:5%;animation-delay:3s">📚</span></div>
<header id="bar" class="nolv"><button id="back">🗺️ الخريطة</button><button id="rst">🔄 إعادة</button><div id="pg"><div id="fill"></div></div><span id="st">0</span>⭐<button id="mus">🔊</button></header>
<main id="app"></main>

function tone(f,t,d,ty,v){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05)}

else if(k==='pop')tone(700,n,.1,'sine',.15);

$('#main').innerHTML=TT(i)+`<div class="subj"><div class="sb" style="background:${s.c}">${s.e}</div><div class="task">حصة ${s.n}</div></div><div class="tray">${s.need.map(()=>'<div class="slot"></div>').join('')}</div><div class="choices">${items.map(k=>`<button class="card" data-k="${k}">${IC[k]}<span>${TOOLS[k]}</span></button>`).join('')}</div>`;
say('دلوقتي عندنا حصة '+s.n+'، يا ترى هنحتاج إيه؟','think');
document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(busy)return;
if(s.need.includes(k)){b.classList.add('used');const sl=document.querySelectorAll('.slot')[ch.length];ch.push(k);sl.innerHTML=IC[k];sl.classList.add('full');sfx('pop');say('أحسنت! '+TOOLS[k]+' مطلوب','happy');
if(ch.length===s.need.length){busy=true;ok(null,'برافو! اخترت كل أدوات حصة '+s.n);P[1]=++i;upd();later(next,2400)}}
else{bad(b,'هذه الأداة مش مطلوبة في حصة '+s.n+'. جرب أداة تانية');glow(s.need.find(x=>!ch.includes(x)))}})}}
function L3(){lvlView();let r=0,sel=null;const R=[{n:'الرياضيات',need:['mathBook','notebook','pencil','ruler']},{n:'الرسم',need:['drawPad','colors','pencil']}];next();
function next(){if(r>=2)return fin(3);const s=R[r],inb=[];sel=null;busy=false;
const items=shuffle([...s.need,...shuffle(['eraser','sharp','case','book','arBook'].filter(k=>!s.need.includes(k))).slice(0,3)]);
$('#main').innerHTML=TT(r*1===0?1:2)+`<div class="task">حصة ${s.n}: جهز شنطتك</div><div class="l3"><div class="side">${items.map(k=>`<button class="card sm" draggable="true" data-k="${k}">${IC[k]}<span>${TOOLS[k]}</span></button>`).join('')}</div><div class="bagwrap" id="bag"><div class="inbag"></div>${BAG}</div></div><button class="btn hint" id="hint">💡 تلميح</button>`;
say('اضغط على الأداة المطلوبة لحصة '+s.n+'، ثم اضغط على الشنطة','happy');
const cards=[...document.querySelectorAll('.side .card')],bag=$('#bag'),ib=$('.inbag');
const put=k=>{const c=cards.find(x=>x.dataset.k===k);
if(s.need.includes(k)&&!inb.includes(k)){inb.push(k);c.style.visibility='hidden';ib.insertAdjacentHTML('beforeend',`<div class="pk">${IC[k]}</div>`);sfx('pop');say('أحسنت! '+TOOLS[k]+' دخلت الشنطة','happy');
if(inb.length===s.need.length){busy=true;bag.classList.add('full');ok(null,'الشنطة جاهزة! أنت بطل!');P[2]=++r;upd();later(next,2600)}}
else{bad(c,'مش محتاجين '+TOOLS[k]+' في حصة '+s.n+'. جرب أداة تانية');glow(s.need.find(x=>!inb.includes(x)))}
sel=null;cards.forEach(x=>x.classList.remove('sel'))};
cards.forEach(c=>{c.onclick=()=>{if(busy)return;sel=c.dataset.k;cards.forEach(x=>x.classList.toggle('sel',x===c));say('دلوقتي اضغط على الشنطة','think');sfx('pop')};c.ondragstart=e=>{sel=c.dataset.k;try{e.dataTransfer.setData('text','x')}catch(_){}}});
bag.onclick=()=>{if(sel&&!busy)put(sel)};bag.ondragover=e=>e.preventDefault();bag.ondrop=e=>{e.preventDefault();if(sel&&!busy)put(sel)};
$('#hint').onclick=()=>{const k=s.need.find(x=>!inb.includes(x)),c=cards.find(x=>x.dataset.k===k);if(c){c.classList.add('good');setTimeout(()=>c.classList.remove('good'),1500);say('ممكن نحتاج '+TOOLS[k],'happy')}}}}
function final(){cur=0;document.body.className='l3';view(`<div class="home"><div class="trophy">🏆</div><h1>أنت بطل! جهزت شنطتك بنفسك</h1><div class="fin"><div class="hero sm">${salim('cheer')}</div><div class="bagwrap full">${BAG}<div class="inbag">${['mathBook','notebook','pencil','ruler'].map(k=>`<div class="pk">${IC[k]}</div>`).join('')}</div></div></div><button class="btn" id="again">العب مرة أخرى</button></div>`);
sfx('win');burst(40);speak('أنت بطل! جهزت شنطتك بنفسك');$('#again').onclick=()=>{S={done:[0,0,0],stars:0};save();map()}}
home();
</script></body></html>
